# nginx site for https://rhea.devcodehub.cloud (static files only).
# Document root: the contents of apps/website/out  ->  /var/www/rhea
# TLS certificates: issue with certbot (see DEPLOY.md), then certbot adjusts the ssl_* lines for you.

server {
    listen 80;
    listen [::]:80;
    server_name rhea.devcodehub.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rhea.devcodehub.cloud;

    ssl_certificate     /etc/letsencrypt/live/rhea.devcodehub.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rhea.devcodehub.cloud/privkey.pem;

    root /var/www/rhea;
    index index.html;
    error_page 404 /404.html;

    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json application/xml image/svg+xml text/plain;

    # Security headers. The CSP allows inline scripts/styles because the static Next.js export uses them.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;   # HTML: always revalidate
    }

    # Hashed assets never change: cache for a year.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /docs/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
