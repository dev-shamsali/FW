name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problem? Do not file it here. Follow SECURITY.md."
  - type: textarea
    id: what
    attributes: { label: What happened, description: "And what did you expect?" }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce, description: "A minimal project or exact commands." }
    validations: { required: true }
  - type: textarea
    id: info
    attributes: { label: Output of `npx rhea info`, render: text }
    validations: { required: true }
  - type: textarea
    id: logs
    attributes: { label: Relevant output, description: "Remove secrets first.", render: text }
