    - region [ref=f2e171]:
      - heading "Security" [level=2] [ref=f2e172]
      - generic [ref=f2e173]:
        - paragraph [ref=f2e174]: Defaults aim to prevent common mistakes. They are not a guarantee, and Rhea.js has not had an independent security review.
        - generic [ref=f2e175]:
          - generic [ref=f2e176]:
            - heading "On by default" [level=3] [ref=f2e177]
            - list [ref=f2e178]:
              - listitem [ref=f2e179]: Helmet security headers
              - listitem [ref=f2e180]: CORS off until you list origins; wildcard refused in production
              - listitem [ref=f2e181]: Rate limit, body size limit, request timeout
              - listitem [ref=f2e182]: Prototype-pollution payloads rejected
              - listitem [ref=f2e183]: No stack traces or internal messages in production
              - listitem [ref=f2e184]: Secrets redacted from logs
              - listitem [ref=f2e185]: Startup aborts on invalid configuration
          - generic [ref=f2e186]:
            - heading "Not included" [level=3] [ref=f2e187]
            - list [ref=f2e188]:
              - listitem [ref=f2e189]: Authentication and authorization
              - listitem [ref=f2e190]: "A shared rate-limit store: counters live in each process"
              - listitem [ref=f2e191]: Protection for routes where you skip validate()
              - listitem [ref=f2e192]: An independent audit
        - paragraph [ref=f2e193]:
          - code [ref=f2e194]: rhea security
          - text: runs static checks on your project. It is not a penetration test. Read the
          - link "security guide" [ref=f2e195] [cursor=pointer]:
            - /url: docs/security.html
          - text: .
    - region [ref=f2e196]:
      - heading "Code examples" [level=2] [ref=f2e197]
      - generic [ref=f2e198]:
        - paragraph [ref=f2e199]: "Validate input and throw typed errors:"
        - generic "Route with validation" [ref=f2e200]: "import { Router, sendSuccess, validate, z, NotFoundError } from \"@rheajs/core\"; const createUser = z.object({ email: z.email() }); export const users = Router(); users.post(\"/\", validate(createUser), (req, res) => sendSuccess(res, req.body, \"Created\", 201)); users.get(\"/:id\", () => { throw new NotFoundError(\"User not found\", { code: \"USER_NOT_FOUND\" }); });"
        - paragraph [ref=f2e201]: "Validate the environment so a bad deployment fails at startup:"
        - generic "Environment validation" [ref=f2e202]: "import { baseEnvShape, loadEnv, z } from \"@rheajs/core\"; export const env = loadEnv({ ...baseEnvShape, DATABASE_URL: z.string().url() });"
    - region [ref=f2e203]:
      - heading "Plugins" [level=2] [ref=f2e204]
      - generic [ref=f2e205]:
        - paragraph [ref=f2e206]:
          - text: "A plugin receives a small context: a logger,"
          - code [ref=f2e207]: addMiddleware
          - text: ","
          - code [ref=f2e208]: mount
          - text: and
          - code [ref=f2e209]: onHook
          - text: . It never touches framework internals, so the API can grow without breaking plugins. The plugin API is alpha and may change.
        - generic "A plugin" [ref=f2e210]: "import { Router, type Plugin } from \"@rheajs/core\"; export const stats: Plugin = { name: \"stats\", setup(ctx) { let hits = 0; ctx.addMiddleware((_req, _res, next) => { hits++; next(); }); ctx.mount(\"/stats\", Router().get(\"/\", (_req, res) => void res.json({ hits }))); }, };"
    - region [ref=f2e211]:
      - heading "Testing" [level=2] [ref=f2e212]
      - generic [ref=f2e213]:
        - paragraph [ref=f2e214]:
          - text: Generated projects use Vitest and Supertest.
          - code [ref=f2e215]: rhea generate module
          - text: adds an integration test. The framework's own test suite includes an end-to-end run that scaffolds a project, installs it, builds it, starts it, checks real HTTP responses and confirms graceful shutdown.
        - generic "An integration test" [ref=f2e216]: const app = await buildApp().ready(); const res = await request(app.express).get("/health"); expect(res.status).toBe(200);
