    - region [ref=f3e171]:
      - heading "Security" [level=2] [ref=f3e172]
      - generic [ref=f3e173]:
        - paragraph [ref=f3e174]: Defaults aim to prevent common mistakes. They are not a guarantee, and Rhea.js has not had an independent security review.
        - generic [ref=f3e175]:
          - generic [ref=f3e176]:
            - heading "On by default" [level=3] [ref=f3e177]
            - list [ref=f3e178]:
              - listitem [ref=f3e179]: Helmet security headers
              - listitem [ref=f3e180]: CORS off until you list origins; wildcard refused in production
              - listitem [ref=f3e181]: Rate limit, body size limit, request timeout
              - listitem [ref=f3e182]: Prototype-pollution payloads rejected
              - listitem [ref=f3e183]: No stack traces or internal messages in production
              - listitem [ref=f3e184]: Secrets redacted from logs
              - listitem [ref=f3e185]: Startup aborts on invalid configuration
          - generic [ref=f3e186]:
            - heading "Not included" [level=3] [ref=f3e187]
            - list [ref=f3e188]:
              - listitem [ref=f3e189]: Authentication and authorization
              - listitem [ref=f3e190]: "A shared rate-limit store: counters live in each process"
              - listitem [ref=f3e191]: Protection for routes where you skip validate()
              - listitem [ref=f3e192]: An independent audit
        - paragraph [ref=f3e193]:
          - code [ref=f3e194]: rhea security
          - text: runs static checks on your project. It is not a penetration test. Read the
          - link "security guide" [ref=f3e195] [cursor=pointer]:
            - /url: docs/security.html
          - text: .
    - region [ref=f3e196]:
      - heading "Code examples" [level=2] [ref=f3e197]
      - generic [ref=f3e198]:
        - paragraph [ref=f3e199]: "Validate input and throw typed errors:"
        - generic "Route with validation" [ref=f3e200]: "import { Router, sendSuccess, validate, z, NotFoundError } from \"@rheajs/core\"; const createUser = z.object({ email: z.email() }); export const users = Router(); users.post(\"/\", validate(createUser), (req, res) => sendSuccess(res, req.body, \"Created\", 201)); users.get(\"/:id\", () => { throw new NotFoundError(\"User not found\", { code: \"USER_NOT_FOUND\" }); });"
        - paragraph [ref=f3e201]: "Validate the environment so a bad deployment fails at startup:"
        - generic "Environment validation" [ref=f3e202]: "import { baseEnvShape, loadEnv, z } from \"@rheajs/core\"; export const env = loadEnv({ ...baseEnvShape, DATABASE_URL: z.string().url() });"
    - region [ref=f3e203]:
      - heading "Plugins" [level=2] [ref=f3e204]
      - generic [ref=f3e205]:
        - paragraph [ref=f3e206]:
          - text: "A plugin receives a small context: a logger,"
          - code [ref=f3e207]: addMiddleware
          - text: ","
          - code [ref=f3e208]: mount
          - text: and
          - code [ref=f3e209]: onHook
          - text: . It never touches framework internals, so the API can grow without breaking plugins. The plugin API is alpha and may change.
        - generic "A plugin" [ref=f3e210]: "import { Router, type Plugin } from \"@rheajs/core\"; export const stats: Plugin = { name: \"stats\", setup(ctx) { let hits = 0; ctx.addMiddleware((_req, _res, next) => { hits++; next(); }); ctx.mount(\"/stats\", Router().get(\"/\", (_req, res) => void res.json({ hits }))); }, };"
    - region [ref=f3e211]:
      - heading "Testing" [level=2] [ref=f3e212]
      - generic [ref=f3e213]:
        - paragraph [ref=f3e214]:
          - text: Generated projects use Vitest and Supertest.
          - code [ref=f3e215]: rhea generate module
          - text: adds an integration test. The framework's own test suite includes an end-to-end run that scaffolds a project, installs it, builds it, starts it, checks real HTTP responses and confirms graceful shutdown.
        - generic "An integration test" [ref=f3e216]: const app = await buildApp().ready(); const res = await request(app.express).get("/health"); expect(res.status).toBe(200);
