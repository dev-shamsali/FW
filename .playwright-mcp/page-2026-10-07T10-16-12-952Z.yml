    - region [ref=f3e78]:
      - heading "Why Rhea.js" [level=2] [ref=f3e79]
      - generic [ref=f3e80]:
        - paragraph [ref=f3e81]: "Express gives you the HTTP layer and leaves everything else to you. Most teams end up wiring the same things in every project: security headers, CORS rules, rate limiting, body limits, request IDs, logging that does not leak secrets, validation, an error handler that hides internals, and a folder layout nobody agreed on."
        - paragraph [ref=f3e82]: Rhea.js makes those decisions once and ships them as defaults. Express stays underneath, so what you know and what you have already written still works.
        - generic "A complete app" [ref=f3e83]: "import { createApp, Router, sendSuccess } from \"@rheajs/core\"; const app = createApp({ cors: { origin: [\"https://app.example.com\"] } }); app.mount(\"/hello\", Router().get(\"/\", (_req, res) => sendSuccess(res, { hi: \"rhea\" }))); await app.start(5000);"
        - paragraph [ref=f3e84]: That one call sets up everything in the pipeline above. Express can do all of it by hand. Rhea.js is about not having to.
    - region [ref=f3e85]:
      - heading "What is included" [level=2] [ref=f3e86]
      - generic [ref=f3e88]:
        - generic [ref=f3e89]:
          - term [ref=f3e90]: Express 5 underneath
          - definition [ref=f3e91]: Your existing Express middleware and knowledge still apply. app.express is the real Express app.
        - generic [ref=f3e92]:
          - term [ref=f3e93]: One error model
          - definition [ref=f3e94]: Throw NotFoundError, ConflictError and friends from anywhere. Clients always get the same JSON shape and never an internal stack in production.
        - generic [ref=f3e95]:
          - term [ref=f3e96]: Validation with Zod
          - definition [ref=f3e97]: validate() checks body, query and params and reports every problem at once.
        - generic [ref=f3e98]:
          - term [ref=f3e99]: Environment that fails loudly
          - definition [ref=f3e100]: A missing or invalid variable stops startup with a list of what to fix.
        - generic [ref=f3e101]:
          - term [ref=f3e102]: Structured logs
          - definition [ref=f3e103]: JSON in production, readable in development, secrets redacted, one line per request with a request ID.
        - generic [ref=f3e104]:
          - term [ref=f3e105]: Graceful shutdown
          - definition [ref=f3e106]: SIGTERM and SIGINT stop accepting requests, finish in-flight ones, then run your shutdown hooks.
        - generic [ref=f3e107]:
          - term [ref=f3e108]: A CLI that writes the boring parts
          - definition [ref=f3e109]: Scaffold a project, generate a module with tests, build, and check your setup.
        - generic [ref=f3e110]:
          - term [ref=f3e111]: Narrow plugin API
          - definition [ref=f3e112]: Plugins get a small, stable surface instead of the whole framework.
    - region [ref=f3e113]:
      - heading "Architecture" [level=2] [ref=f3e114]
      - generic [ref=f3e115]:
        - paragraph [ref=f3e116]: A project is organised by feature. Each module holds its controller, service, repository, routes, schema and types together, so code that changes together stays together.
        - generic "Generated project structure" [ref=f3e117]: "my-api/ ├── src/ │ ├── config/env.ts validated environment │ ├── modules/ │ │ ├── index.ts module registry │ │ ├── health/ │ │ └── users/ generated by: rhea generate module users │ │ ├── users.controller.ts │ │ ├── users.service.ts │ │ ├── users.repository.ts │ │ ├── users.routes.ts │ │ ├── users.schema.ts │ │ └── users.types.ts │ ├── middleware/ core/ utils/ types/ │ ├── app.ts buildApp() │ └── server.ts ├── tests/{unit,integration,e2e}/ └── .env .env.example tsconfig*.json vitest.config.ts"
        - paragraph [ref=f3e118]: "The app moves through a fixed lifecycle, and you can hook into any step:"
        - list [ref=f3e119]:
          - listitem [ref=f3e120]:
