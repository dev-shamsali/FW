    - region [ref=f1e82]:
      - heading "Why Rhea.js" [level=2] [ref=f1e83]
      - generic [ref=f1e84]:
        - paragraph [ref=f1e85]: "Express gives you the HTTP layer and leaves everything else to you. Most teams end up wiring the same things in every project: security headers, CORS rules, rate limiting, body limits, request IDs, logging that does not leak secrets, validation, an error handler that hides internals, and a folder layout nobody agreed on."
        - paragraph [ref=f1e86]: Rhea.js makes those decisions once and ships them as defaults. Express stays underneath, so what you know and what you have already written still works.
        - generic "A complete app" [ref=f1e87]: "import { createApp, Router, sendSuccess } from \"@rheajs/core\"; const app = createApp({ cors: { origin: [\"https://app.example.com\"] } }); app.mount(\"/hello\", Router().get(\"/\", (_req, res) => sendSuccess(res, { hi: \"rhea\" }))); await app.start(5000);"
        - paragraph [ref=f1e88]: That one call sets up everything in the pipeline above. Express can do all of it by hand. Rhea.js is about not having to.
    - region [ref=f1e89]:
      - heading "What is included" [level=2] [ref=f1e90]
      - generic [ref=f1e92]:
        - generic [ref=f1e93]:
          - term [ref=f1e94]: Express 5 underneath
          - definition [ref=f1e95]: Your existing Express middleware and knowledge still apply. app.express is the real Express app.
        - generic [ref=f1e96]:
          - term [ref=f1e97]: One error model
          - definition [ref=f1e98]: Throw NotFoundError, ConflictError and friends from anywhere. Clients always get the same JSON shape and never an internal stack in production.
        - generic [ref=f1e99]:
          - term [ref=f1e100]: Validation with Zod
          - definition [ref=f1e101]: validate() checks body, query and params and reports every problem at once.
        - generic [ref=f1e102]:
          - term [ref=f1e103]: Environment that fails loudly
          - definition [ref=f1e104]: A missing or invalid variable stops startup with a list of what to fix.
        - generic [ref=f1e105]:
          - term [ref=f1e106]: Structured logs
          - definition [ref=f1e107]: JSON in production, readable in development, secrets redacted, one line per request with a request ID.
        - generic [ref=f1e108]:
          - term [ref=f1e109]: Graceful shutdown
          - definition [ref=f1e110]: SIGTERM and SIGINT stop accepting requests, finish in-flight ones, then run your shutdown hooks.
        - generic [ref=f1e111]:
          - term [ref=f1e112]: A CLI that writes the boring parts
          - definition [ref=f1e113]: Scaffold a project, generate a module with tests, build, and check your setup.
        - generic [ref=f1e114]:
          - term [ref=f1e115]: Narrow plugin API
          - definition [ref=f1e116]: Plugins get a small, stable surface instead of the whole framework.
    - region [ref=f1e117]:
      - heading "Architecture" [level=2] [ref=f1e118]
      - generic [ref=f1e119]:
        - paragraph [ref=f1e120]: A project is organised by feature. Each module holds its controller, service, repository, routes, schema and types together, so code that changes together stays together.
        - generic "Generated project structure" [ref=f1e121]: "my-api/ ├── src/ │ ├── config/env.ts validated environment │ ├── modules/ │ │ ├── index.ts module registry │ │ ├── health/ │ │ └── users/ generated by: rhea generate module users │ │ ├── users.controller.ts │ │ ├── users.service.ts │ │ ├── users.repository.ts │ │ ├── users.routes.ts │ │ ├── users.schema.ts │ │ └── users.types.ts │ ├── middleware/ core/ utils/ types/ │ ├── app.ts buildApp() │ └── server.ts ├── tests/{unit,integration,e2e}/ └── .env .env.example tsconfig*.json vitest.config.ts"
        - paragraph [ref=f1e122]: "The app moves through a fixed lifecycle, and you can hook into any step:"
        - list [ref=f1e123]:
          - listitem [ref=f1e124]:
            - code [ref=f1e125]: beforeInit
