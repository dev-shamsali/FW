    - region [ref=e82]:
      - heading "Why Rhea.js" [level=2] [ref=e83]
      - generic [ref=e84]:
        - paragraph [ref=e85]: "Express gives you the HTTP layer and leaves everything else to you. Most teams end up wiring the same things in every project: security headers, CORS rules, rate limiting, body limits, request IDs, logging that does not leak secrets, validation, an error handler that hides internals, and a folder layout nobody agreed on."
        - paragraph [ref=e86]: Rhea.js makes those decisions once and ships them as defaults. Express stays underneath, so what you know and what you have already written still works.
        - generic "A complete app" [ref=e87]: "import { createApp, Router, sendSuccess } from \"@rheajs/core\"; const app = createApp({ cors: { origin: [\"https://app.example.com\"] } }); app.mount(\"/hello\", Router().get(\"/\", (_req, res) => sendSuccess(res, { hi: \"rhea\" }))); await app.start(5000);"
        - paragraph [ref=e88]: That one call sets up everything in the pipeline above. Express can do all of it by hand. Rhea.js is about not having to.
    - region [ref=e89]:
      - heading "What is included" [level=2] [ref=e90]
      - generic [ref=e92]:
        - generic [ref=e93]:
          - term [ref=e94]: Express 5 underneath
          - definition [ref=e95]: Your existing Express middleware and knowledge still apply. app.express is the real Express app.
        - generic [ref=e96]:
          - term [ref=e97]: One error model
          - definition [ref=e98]: Throw NotFoundError, ConflictError and friends from anywhere. Clients always get the same JSON shape and never an internal stack in production.
        - generic [ref=e99]:
          - term [ref=e100]: Validation with Zod
          - definition [ref=e101]: validate() checks body, query and params and reports every problem at once.
        - generic [ref=e102]:
          - term [ref=e103]: Environment that fails loudly
          - definition [ref=e104]: A missing or invalid variable stops startup with a list of what to fix.
        - generic [ref=e105]:
          - term [ref=e106]: Structured logs
          - definition [ref=e107]: JSON in production, readable in development, secrets redacted, one line per request with a request ID.
        - generic [ref=e108]:
          - term [ref=e109]: Graceful shutdown
          - definition [ref=e110]: SIGTERM and SIGINT stop accepting requests, finish in-flight ones, then run your shutdown hooks.
        - generic [ref=e111]:
          - term [ref=e112]: A CLI that writes the boring parts
          - definition [ref=e113]: Scaffold a project, generate a module with tests, build, and check your setup.
        - generic [ref=e114]:
          - term [ref=e115]: Narrow plugin API
          - definition [ref=e116]: Plugins get a small, stable surface instead of the whole framework.
    - region [ref=e117]:
      - heading "Architecture" [level=2] [ref=e118]
      - generic [ref=e119]:
        - paragraph [ref=e120]: A project is organised by feature. Each module holds its controller, service, repository, routes, schema and types together, so code that changes together stays together.
        - generic "Generated project structure" [ref=e121]: "my-api/ ├── src/ │ ├── config/env.ts validated environment │ ├── modules/ │ │ ├── index.ts module registry │ │ ├── health/ │ │ └── users/ generated by: rhea generate module users │ │ ├── users.controller.ts │ │ ├── users.service.ts │ │ ├── users.repository.ts │ │ ├── users.routes.ts │ │ ├── users.schema.ts │ │ └── users.types.ts │ ├── middleware/ core/ utils/ types/ │ ├── app.ts buildApp() │ └── server.ts ├── tests/{unit,integration,e2e}/ └── .env .env.example tsconfig*.json vitest.config.ts"
        - paragraph [ref=e122]: "The app moves through a fixed lifecycle, and you can hook into any step:"
        - list [ref=e123]:
          - listitem [ref=e124]:
            - code [ref=e125]: beforeInit
          - listitem [ref=e126]:
            - code [ref=e127]: init
          - listitem [ref=e128]:
