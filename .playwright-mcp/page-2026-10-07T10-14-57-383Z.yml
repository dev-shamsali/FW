    - region [ref=e175]:
      - heading "Security" [level=2] [ref=e176]
      - generic [ref=e177]:
        - paragraph [ref=e178]: Defaults aim to prevent common mistakes. They are not a guarantee, and Rhea.js has not had an independent security review.
        - generic [ref=e179]:
          - generic [ref=e180]:
            - heading "On by default" [level=3] [ref=e181]
            - list [ref=e182]:
              - listitem [ref=e183]: Helmet security headers
              - listitem [ref=e184]: CORS off until you list origins; wildcard refused in production
              - listitem [ref=e185]: Rate limit, body size limit, request timeout
              - listitem [ref=e186]: Prototype-pollution payloads rejected
              - listitem [ref=e187]: No stack traces or internal messages in production
              - listitem [ref=e188]: Secrets redacted from logs
              - listitem [ref=e189]: Startup aborts on invalid configuration
          - generic [ref=e190]:
            - heading "Not included" [level=3] [ref=e191]
            - list [ref=e192]:
              - listitem [ref=e193]: Authentication and authorization
              - listitem [ref=e194]: "A shared rate-limit store: counters live in each process"
              - listitem [ref=e195]: Protection for routes where you skip validate()
              - listitem [ref=e196]: An independent audit
        - paragraph [ref=e197]:
          - code [ref=e198]: rhea security
          - text: runs static checks on your project. It is not a penetration test. Read the
          - link "security guide" [ref=e199] [cursor=pointer]:
            - /url: docs/security.html
          - text: .
    - region [ref=e200]:
      - heading "Code examples" [level=2] [ref=e201]
      - generic [ref=e202]:
        - paragraph [ref=e203]: "Validate input and throw typed errors:"
        - generic "Route with validation" [ref=e204]: "import { Router, sendSuccess, validate, z, NotFoundError } from \"@rheajs/core\"; const createUser = z.object({ email: z.email() }); export const users = Router(); users.post(\"/\", validate(createUser), (req, res) => sendSuccess(res, req.body, \"Created\", 201)); users.get(\"/:id\", () => { throw new NotFoundError(\"User not found\", { code: \"USER_NOT_FOUND\" }); });"
        - paragraph [ref=e205]: "Validate the environment so a bad deployment fails at startup:"
        - generic "Environment validation" [ref=e206]: "import { baseEnvShape, loadEnv, z } from \"@rheajs/core\"; export const env = loadEnv({ ...baseEnvShape, DATABASE_URL: z.string().url() });"
    - region [ref=e207]:
      - heading "Plugins" [level=2] [ref=e208]
      - generic [ref=e209]:
        - paragraph [ref=e210]:
          - text: "A plugin receives a small context: a logger,"
          - code [ref=e211]: addMiddleware
          - text: ","
          - code [ref=e212]: mount
          - text: and
          - code [ref=e213]: onHook
          - text: . It never touches framework internals, so the API can grow without breaking plugins. The plugin API is alpha and may change.
        - generic "A plugin" [ref=e214]: "import { Router, type Plugin } from \"@rheajs/core\"; export const stats: Plugin = { name: \"stats\", setup(ctx) { let hits = 0; ctx.addMiddleware((_req, _res, next) => { hits++; next(); }); ctx.mount(\"/stats\", Router().get(\"/\", (_req, res) => void res.json({ hits }))); }, };"
    - region [ref=e215]:
      - heading "Testing" [level=2] [ref=e216]
      - generic [ref=e217]:
        - paragraph [ref=e218]:
          - text: Generated projects use Vitest and Supertest.
          - code [ref=e219]: rhea generate module
          - text: adds an integration test. The framework's own test suite includes an end-to-end run that scaffolds a project, installs it, builds it, starts it, checks real HTTP responses and confirms graceful shutdown.
        - generic "An integration test" [ref=e220]: const app = await buildApp().ready(); const res = await request(app.express).get("/health"); expect(res.status).toBe(200);
